<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rikiki - Bejelentkezés</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 2px solid var(--accent-color);
        }

        .auth-title {
            text-align: center;
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 30px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
        }

        .auth-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .auth-tab.active {
            background: var(--accent-color);
            color: #1a1a2e;
            font-weight: bold;
        }

        .auth-tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-light);
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-light);
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .btn-auth {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
        }

        .auth-error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .auth-success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .card-decoration {
            position: fixed;
            font-size: 4rem;
            opacity: 0.1;
            pointer-events: none;
        }

        .card-decoration:nth-child(1) { top: 10%; left: 5%; }
        .card-decoration:nth-child(2) { top: 20%; right: 10%; }
        .card-decoration:nth-child(3) { bottom: 15%; left: 15%; }
        .card-decoration:nth-child(4) { bottom: 25%; right: 5%; }
    </style>
</head>
<body>
    <div class="card-decoration">&#9824;</div>
    <div class="card-decoration">&#9829;</div>
    <div class="card-decoration">&#9830;</div>
    <div class="card-decoration">&#9827;</div>

    <div class="auth-container">
        <div class="auth-box">
            <h1 class="auth-title">Rikiki</h1>
            <p class="auth-subtitle">Magyar kArtyAjAték</p>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="showTab('login')">Bejelentkezés</button>
                <button class="auth-tab" onclick="showTab('register')">Regisztráció</button>
            </div>

            <div id="auth-error" class="auth-error"></div>
            <div id="auth-success" class="auth-success"></div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-username">Felhasználónév</label>
                    <input type="text" id="login-username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">Jelszó</label>
                    <input type="password" id="login-password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-auth">Bejelentkezés</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="reg-username">Felhasználónév</label>
                    <input type="text" id="reg-username" name="username" required minlength="3" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="reg-displayname">Megjelenítési név</label>
                    <input type="text" id="reg-displayname" name="displayName" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Jelszó</label>
                    <input type="password" id="reg-password" name="password" required minlength="4" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="reg-password2">Jelszó megerősítése</label>
                    <input type="password" id="reg-password2" name="password2" required minlength="4" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary btn-auth">Regisztráció</button>
            </form>
        </div>
    </div>

    <script>
        function showTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

            if (tab === 'login') {
                document.querySelector('.auth-tab:first-child').classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelector('.auth-tab:last-child').classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }

            hideMessages();
        }

        function showError(message) {
            const el = document.getElementById('auth-error');
            el.textContent = message;
            el.style.display = 'block';
            document.getElementById('auth-success').style.display = 'none';
        }

        function showSuccess(message) {
            const el = document.getElementById('auth-success');
            el.textContent = message;
            el.style.display = 'block';
            document.getElementById('auth-error').style.display = 'none';
        }

        function hideMessages() {
            document.getElementById('auth-error').style.display = 'none';
            document.getElementById('auth-success').style.display = 'none';
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideMessages();

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = '/lobby';
                } else {
                    showError(data.error);
                }
            } catch (error) {
                showError('Hálózati hiba történt!');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            hideMessages();

            const username = document.getElementById('reg-username').value;
            const displayName = document.getElementById('reg-displayname').value;
            const password = document.getElementById('reg-password').value;
            const password2 = document.getElementById('reg-password2').value;

            if (password !== password2) {
                showError('A két jelszó nem egyezik!');
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, displayName })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('Sikeres regisztráció! Most már bejelentkezhetsz.');
                    setTimeout(() => showTab('login'), 1500);
                } else {
                    showError(data.error);
                }
            } catch (error) {
                showError('Hálózati hiba történt!');
            }
        }
    </script>
</body>
</html>
